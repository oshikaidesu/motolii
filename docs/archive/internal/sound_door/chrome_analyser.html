<!doctype html>
<meta charset="utf-8">
<title>AnalyserNode reference</title>
<pre id="out">running</pre>
<script>
// What Chrome's AnalyserNode, as it comes (fftSize 2048), reads of a known sound on a 48,000 Hz context,
// asked sixty times a second from the start, as a page that draws every frame asks it.
// The sound: one second of silence, then a 1000 Hz sine of amplitude 0.5 until 2 s, then silence until 3 s.
(async () => { try {
  const rate = 48000, seconds = 3, bins = [0, 5, 20, 38, 41, 43, 45, 48, 60, 85, 128, 256, 500];
  const ctx = new OfflineAudioContext(1, rate * seconds, rate);
  const buffer = ctx.createBuffer(1, rate * seconds, rate), data = buffer.getChannelData(0);
  for (let i = rate; i < 2 * rate; i++) data[i] = 0.5 * Math.sin(2 * Math.PI * 1000 * i / rate);
  const source = ctx.createBufferSource(); source.buffer = buffer;
  const analyser = ctx.createAnalyser();
  source.connect(analyser); analyser.connect(ctx.destination); source.start();
  const rows = {}, bytes = new Uint8Array(1024), wave = new Float32Array(2048);
  for (let k = 1; k < 60 * seconds; k++)
    ctx.suspend(k / 60).then(() => {
      analyser.getByteFrequencyData(bytes); analyser.getFloatTimeDomainData(wave);
      let peak = 0; for (const s of wave) peak = Math.max(peak, Math.abs(s));
      rows[k] = bins.map(b => bytes[b]).concat([Math.round(peak * 1000) / 1000]);
      ctx.resume();
    });
  await ctx.startRendering();
  document.getElementById('out').textContent = JSON.stringify({ rate, bins, settings: [analyser.fftSize, analyser.minDecibels, analyser.maxDecibels, analyser.smoothingTimeConstant], rows });
} catch (e) { document.getElementById('out').textContent = 'error ' + e; } })();
</script>
