<!doctype html><html><head><meta charset="utf-8"><style>* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  width: 100%;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Montserrat;
  font-size: 3rem;
  color: #fff;
  background-image: linear-gradient(120deg, #89f7fe 0%, #66a6ff 100%);
}
.wrapper {
  height: 200px;
  width: 400px;
  display: flex;
  justify-content: center;
  align-items: center;
}
.loading .char {
  overflow: hidden;
  color: #000;
  letter-spacing: 2px;
  animation: anim 1s ease infinite;
  animation-delay: calc( 0.4s + ( 0.1s * ( var(--char-index)) ) );
  transform: translateY(10%);
}
@keyframes anim {
  0% {
    transform: translateY(10%);
  }
  50% {
    transform: translateY(-25%);
  }
  100% {
    transform: translateY(10%);
  }
}
</style></head><body><div class="wrapper">
	<span data-splitting class="loading words chars splitting" style="--word-total: 1; --char-total: 8;"><span class="word" data-word="waveeeee" style="--word-index: 0;"><span class="char" data-char="w" style="--char-index: 0;">w</span><span class="char" data-char="a" style="--char-index: 1;">a</span><span class="char" data-char="v" style="--char-index: 2;">v</span><span class="char" data-char="e" style="--char-index: 3;">e</span><span class="char" data-char="e" style="--char-index: 4;">e</span><span class="char" data-char="e" style="--char-index: 5;">e</span><span class="char" data-char="e" style="--char-index: 6;">e</span><span class="char" data-char="e" style="--char-index: 7;">e</span></span></span>
</div>
</body></html>
