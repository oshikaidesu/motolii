  <g id="face">
    <rect x="20" y="40" width="120" height="80" fill="#ff3366"/>
    <circle cx="100" cy="150" r="20" fill="#3366ff" stroke="#000000" stroke-width="4"/>
  </g>
  <g id="layer2" inkscape:groupmode="layer" inkscape:label="Hat" transform="translate(200 0)">
