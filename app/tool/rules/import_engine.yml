# Only these reach the engine (package:motolii/bridge/): lib/bridge, lib/main.dart, the window's state, and the feed that turns
# the engine's values into the inspector's cards. A panel listens to a WorkspaceAspect and reads the state instead.
# `ignores` has two parts. The first is permanent. The second is the baseline: files that imported the engine before the rule
# existed. Delete a line when the file is fixed; never add one (a new file that imports the engine must be fixed instead).
id: import-engine
language: dart
severity: error
message: A panel reads the window's state (lib/workspace/state) and listens to a WorkspaceAspect; it does not import the engine.
rule:
  kind: uri
  regex: "^'package:motolii/bridge/"
files:
  - lib/**
ignores:
  - lib/bridge/**
  - lib/main.dart
  - lib/workspace/state/**
  - lib/workspace/inspector_feed/**
  # baseline
  - lib/skin/theme.dart
  - lib/workspace/agent/agent_pane.dart
  - lib/workspace/agent/agent_registry.dart
  - lib/workspace/agent/layer_code.dart
  - lib/workspace/code/expression_reference.dart
