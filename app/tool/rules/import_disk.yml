# Only these touch the disk or native memory (dart:io, dart:ffi, package:ffi): lib/bridge, lib/main.dart, and lib/storage, which
# a panel reads through (lib/storage/disk.dart).
# `ignores` has two parts. The first is permanent. The second is the baseline: files that imported them before the rule
# existed. Delete a line when the file is fixed; never add one (a new file that does must go through lib/storage instead).
id: import-disk
language: dart
severity: error
message: The disk and native memory are read through lib/storage (or lib/bridge), not by a panel importing dart:io or dart:ffi.
rule:
  kind: uri
  regex: "^'(dart:io'|dart:ffi'|package:ffi/)"
files:
  - lib/**
ignores:
  - lib/bridge/**
  - lib/main.dart
  - lib/storage/**
  # baseline
  - lib/skin/skin_parts.dart
  - lib/skin/theme.dart
  - lib/widgets/font_files.dart
  - lib/workspace/agent/agent_pane.dart
