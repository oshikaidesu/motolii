# The inside's calls as Dart sees them, made by Dart's own ffigen from engine/entry/motolii.h (not written by hand):
#   dart run ffigen --config ffigen.yaml
name: MotoliiBindings
description: The inside's C calls (engine/entry/motolii.h), made by ffigen.
output: lib/engine/motolii_bindings.dart
headers:
  entry-points:
    - ../engine/entry/motolii.h
functions:
  include:
    - 'motolii_.*'
  leaf:
    include:
      - 'motolii_broken_count'   # (read every picture, no wait: as the hand wrote it)
llvm-path:
  - /Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/libclang.dylib
type-map:
  native-types:
    'char':
      lib: 'pkg_ffi'
      c-type: 'Utf8'
      dart-type: 'int'
