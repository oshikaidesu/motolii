include: package:flutter_lints/flutter.yaml

# The width `dart format` and editors' format-on-save use (dart.dev/tools/dart-format, "Configuring formatter page width").
formatter:
  page_width: 160

analyzer:
  exclude:
    - build/**
    - macos/**

linter:
  rules:
    # A file names every neighbour by its package path, so a file can move without its imports being rewritten.
    always_use_package_imports: true
