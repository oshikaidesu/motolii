[package]
name = "motolii_css"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "css.rs"
crate-type = ["staticlib", "rlib"]

[dependencies]
blitz-dom = { version = "=0.3.0-beta.4", default-features = false }
blitz-html = { version = "=0.3.0-beta.4", default-features = false }
blitz-traits = { version = "=0.3.0-beta.4", default-features = false }
style = { package = "stylo", version = "=0.22.0" }
euclid = "0.22"
# A text layer's letters laid out with CSS on ranges of them (text.rs): Parley as Blitz uses it, harfrust for vertical
# OpenType shaping, and skrifa for outlines & font metadata — all at the versions Blitz already brings.
parley = { version = "=0.12.0", default-features = false, features = ["std"] }
harfrust = { version = "=0.12.0", default-features = false, features = ["std"] }
skrifa = { version = "=0.44.0", default-features = false, features = ["std"] }
icu_properties = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }
icu_segmenter = { version = "=2.4.0", default-features = false, features = ["compiled_data", "auto"] }
# The SVG's own text and its transform attribute, read as resvg reads them (svg.rs).
roxmltree = "0.20"
svgtypes = "0.16"

# Stylo with one patch (deps/stylo.sh, deps/patches/stylo/).
[patch.crates-io]
stylo = { path = "../../third_party/stylo_src" }

[profile.release]
debug = false
# With no debug info there is nothing to strip, but cargo still calls rust-objcopy, which SIGABRTs on this
# toolchain (its rust-objcopy cannot load libLLVM.dylib). strip = false skips that call; the warning made
# every clean build look as if it had failed.
strip = false
