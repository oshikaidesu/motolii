<!doctype html>
<!-- An Expression's Block mode (block_code.dart): Google's Blockly (Apache-2.0, blockly/LICENSE, npm blockly 13.4.0) as it
     comes, with one block of Motolii's own, "copy i of n at time t", whose slots take Blockly's own math and variables.
     The workspace (Blockly's JSON) is the source; Blockly's JavaScript generator writes each(i, n, t, k) from it. Each
     change is told to the window (the Motolii channel) as {state, code}; the window keeps the state beside the card's
     code copy and writes the code into it. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body, #blocks { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1e1f22; }
</style>
<script src="blockly/blockly_compressed.js"></script>
<script src="blockly/blocks_compressed.js"></script>
<script src="blockly/javascript_compressed.js"></script>
<script src="blockly/msg/en.js"></script>
</head>
<body>
<div id="blocks"></div>
<script>
// (what each() is told, as script.cpp asks it: copy i of n, the thing's own time t in seconds; each a value block)
Blockly.common.defineBlocksWithJsonArray([
  {
    type: 'motolii_copy',
    message0: 'copy i of n at time t',
    message1: 'x %1', args1: [{type: 'input_value', name: 'X', check: 'Number', align: 'RIGHT'}],
    message2: 'y %1', args2: [{type: 'input_value', name: 'Y', check: 'Number', align: 'RIGHT'}],
    message3: 'rotate %1', args3: [{type: 'input_value', name: 'ROTATE', check: 'Number', align: 'RIGHT'}],
    message4: 'size %1', args4: [{type: 'input_value', name: 'SIZE', check: 'Number', align: 'RIGHT'}],
    colour: 210,
    tooltip: 'Where copy i of n lies at time t: x and y in the stage\'s units, rotate in degrees, size times its own. A thing with no copies is copy 0 of 1.',
  },
  {type: 'motolii_i', message0: 'i', output: 'Number', colour: 210, tooltip: 'Which copy: 0, 1, 2…'},
  {type: 'motolii_n', message0: 'n', output: 'Number', colour: 210, tooltip: 'How many copies'},
  {type: 'motolii_t', message0: 't', output: 'Number', colour: 210, tooltip: 'The thing\'s time, in seconds'},
]);
const js = javascript.javascriptGenerator, Order = javascript.Order;
js.forBlock['motolii_i'] = () => ['i', Order.ATOMIC];
js.forBlock['motolii_n'] = () => ['n', Order.ATOMIC];
js.forBlock['motolii_t'] = () => ['t', Order.ATOMIC];
js.forBlock['motolii_copy'] = (block, g) => {
  const v = (name, otherwise) => g.valueToCode(block, name, Order.NONE) || otherwise;
  return 'return { x: ' + v('X', '0') + ', y: ' + v('Y', '0') + ', rotate: ' + v('ROTATE', '0') + ', size: ' + v('SIZE', '1') + ' };\n';
};
const number = (n) => ({shadow: {type: 'math_number', fields: {NUM: n}}});
const first = {blocks: {languageVersion: 0, blocks: [{type: 'motolii_copy', x: 20, y: 20, inputs: {X: number(0), Y: number(0), ROTATE: number(0), SIZE: number(1)}}]}};
const toolbox = {
  kind: 'categoryToolbox',
  contents: [
    {kind: 'category', name: 'Copy', colour: 210, contents: [
      {kind: 'block', type: 'motolii_t'}, {kind: 'block', type: 'motolii_i'}, {kind: 'block', type: 'motolii_n'},
      {kind: 'block', type: 'motolii_copy', inputs: {X: number(0), Y: number(0), ROTATE: number(0), SIZE: number(1)}},
    ]},
    {kind: 'category', name: 'Math', categorystyle: 'math_category', contents: [
      {kind: 'block', type: 'math_number'},
      {kind: 'block', type: 'math_arithmetic', inputs: {A: number(1), B: number(1)}},
      {kind: 'block', type: 'math_single', inputs: {NUM: number(9)}},
      {kind: 'block', type: 'math_trig', inputs: {NUM: number(45)}},
      {kind: 'block', type: 'math_constant'},
      {kind: 'block', type: 'math_round', inputs: {NUM: number(3.1)}},
      {kind: 'block', type: 'math_modulo', inputs: {DIVIDEND: number(64), DIVISOR: number(10)}},
      {kind: 'block', type: 'math_constrain', inputs: {VALUE: number(50), LOW: number(1), HIGH: number(100)}},
      {kind: 'block', type: 'math_random_float'},
    ]},
    {kind: 'category', name: 'Variables', categorystyle: 'variable_category', custom: 'VARIABLE'},
  ],
};
const ws = Blockly.inject('blocks', {
  toolbox, media: 'blockly/media/', sounds: false, trashcan: false, renderer: 'thrasos',
  horizontalLayout: true, toolboxPosition: 'start',   // (the categories along the top: a card is narrow, Blockly's own layout option)
  modalInputs: false,   // (a number edited in place: Blockly takes a Mac with a touch point for an iPad and asks by window.prompt, which the window does not answer)
  theme: Blockly.Theme.defineTheme('motolii_dark', {base: Blockly.Themes.Classic, componentStyles: {
    workspaceBackgroundColour: '#1e1f22', toolboxBackgroundColour: '#2b2d31', toolboxForegroundColour: '#d8d8d8',
    flyoutBackgroundColour: '#2b2d31', flyoutForegroundColour: '#d8d8d8', scrollbarColour: '#555', insertionMarkerColour: '#fff',
  }}),
  zoom: {controls: false, wheel: true, startScale: 0.8},
  move: {scrollbars: true, drag: true, wheel: false},
});
// The code: each() of the first "copy" block, the generator's own definitions (its variables, its helper functions) in it.
function code() {
  const copy = ws.getTopBlocks(true).find((b) => b.type === 'motolii_copy' && b.isEnabled());
  js.init(ws);
  const body = js.finish(copy ? js.blockToCode(copy) : 'return {};\n');
  const lines = js.prefixLines(body, js.INDENT).split('\n').filter((l) => l.trim() !== '');
  return 'function each(i, n, t, k) {\n' + lines.join('\n') + '\n}\n';
}
let told = false;
// (told by the window once the page is up: the state kept beside the code, or none: the first block)
function motoliiLoad(state) {
  Blockly.Events.disable();   // (loading is no change to tell)
  try {
    ws.clear();
    Blockly.serialization.workspaces.load(state || first, ws);
  } finally {
    Blockly.Events.enable();
  }
  if (told) return;
  told = true;
  ws.addChangeListener((e) => {
    if (e.isUiEvent || ws.isDragging()) return;
    Motolii.postMessage(JSON.stringify({state: Blockly.serialization.workspaces.save(ws), code: code()}));
  });
}
addEventListener('resize', () => Blockly.svgResize(ws));
// A key the page does not use is passed on by WebKit to the window (macOS: the view under it, then Flutter), which takes
// it as one of its own shortcuts (flutter/flutter#184557). So a plain key is the page's while it has it: taken (default
// prevented) once Blockly has had it, unless it is being typed into a field. A key with ⌘ or ctrl goes on to the menus.
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey) return;
  const typing = e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement || e.target.isContentEditable;
  if (!typing || ['Enter', 'Escape', 'Tab'].includes(e.key)) e.preventDefault();
});
// What the page is given, told to the window when it asks (MOTOLII_INPUT_LOG=1: block_code.dart), each line with how
// many animation frames have run (Blockly renders and tells its changes on them) and who has the page's focus: the
// pointer from a press to its release, keys, focus coming and going, a field's editor opened and closed.
let frames = 0;
(function frame() { frames++; requestAnimationFrame(frame); })();
let logging = false;
function motoliiLog() {
  if (logging) return;
  logging = true;
  const name = (el) => !el ? 'none' : (el.getAttribute && el.getAttribute('class')) || el.tagName || String(el);
  const tell = (what) => Motolii.postMessage(JSON.stringify({say: what + ' | raf ' + frames + ' page-focus ' + document.hasFocus() + ' active ' + name(document.activeElement)}));
  let down = false;
  for (const t of ['pointerdown', 'pointermove', 'pointerup', 'pointercancel']) {
    addEventListener(t, (e) => {
      if (t === 'pointerdown') down = true;
      if (t === 'pointermove' && !down) return;
      if (t === 'pointerup' || t === 'pointercancel') down = false;
      tell(t + ' ' + e.pointerType + ' buttons ' + e.buttons + ' at ' + Math.round(e.clientX) + ',' + Math.round(e.clientY) + ' on ' + name(e.target) + ' dragging ' + ws.isDragging());
    }, true);
  }
  addEventListener('keydown', (e) => tell('keydown ' + e.key + ' on ' + name(e.target)), true);
  document.addEventListener('focusin', (e) => tell('focusin ' + name(e.target)), true);
  document.addEventListener('focusout', (e) => tell('focusout ' + name(e.target) + ' to ' + name(e.relatedTarget)), true);
  addEventListener('focus', () => tell('window focus'));
  addEventListener('blur', () => tell('window blur'));
  new MutationObserver((changes) => {
    for (const c of changes) {
      for (const n of c.addedNodes) if (n.classList && n.classList.contains('blocklyHtmlInput')) tell('editor open');
      for (const n of c.removedNodes) if (n.classList && n.classList.contains('blocklyHtmlInput')) tell('editor close');
    }
  }).observe(document.body, {childList: true, subtree: true});
  ws.addChangeListener((e) => tell('blockly ' + e.type));
  setInterval(() => tell('alive'), 3000);
  tell('log on');
}
</script>
</body>
</html>
