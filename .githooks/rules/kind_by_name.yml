# One kind of layer is known in one place. A branch on a kind's name in another file is that knowledge written again:
# a new kind then needs a branch added in each of them. (The names are the layer kinds compared in 4 to 8 engine files
# on 2026-11-10; "camera" in 8.)
id: kind-by-name
language: cpp
severity: error
message: a layer kind compared by name
note: ask the kinds table for the property this branch is about (has a picture, is 3D, has a length), not for the name
ignores: ['**/third_party/**', '**/out/**']
rule:
  kind: binary_expression
  has:
    kind: string_literal
    regex: ^"(camera|video|solid|image|text|light|glass|three)"$
