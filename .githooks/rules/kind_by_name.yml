# One kind of layer is known in one place. A branch on a kind's name in another file is that knowledge written again:
# a new kind then needs a branch added in each of them. The kinds are those of engine/document/kinds.h (doc_kinds),
# with behaviour and stage. engine/community/ is left out: an adapter speaks its own tool's words (AviUtl's obj.load
# has a "kind" too). Read by hand on 2026-11-10: 44 of these sites ask a property a table could hold (has a picture,
# has sound, is flat), 29 of them one that engine/document/kinds.h already says in a row.
id: kind-by-name
language: cpp
severity: error
message: a layer kind compared by name
note: ask for the property this branch is about (has a picture, has sound, is flat, is a relation), not for the name
ignores: ['**/third_party/**', '**/out/**', '**/community/**']
rule:
  any:
    - kind: binary_expression
      regex: kind
      has:
        kind: string_literal
        regex: ^"(camera|video|solid|image|text|light|shape|behaviour|stage)"$
    - kind: call_expression
      regex: ^!?strcmp\(\s*kind
      has:
        stopBy: end
        kind: string_literal
        regex: ^"(camera|video|solid|image|text|light|shape|behaviour|stage)"$
