# AGENTS.md principle 5: Dart holds the looks. A press, a hover and what floats over the window belong to naked_ui
# (NakedButton, NakedToggle, NakedSlider, NakedTextField, NakedMenu, NakedPopover) or to Flutter's own widgets.
# Seen failing: 211 matches on app/lib of 2cca45574 (before the cut), 6 on c57338193.
id: hand-press
language: dart
severity: error
message: a press, hover or overlay written by hand in Dart
note: use the standard's part in app/lib/widgets/ (Hov, IconPress, Chip, MiniSlider, TypedField, NumberField); it stands on naked_ui or Flutter's own widget
# app/lib/widgets/ is the standard every panel stands on: the one place a press of our own may be written (on naked_ui
# where it has the part). A panel uses the standard's parts and writes none.
ignores: ['**/motolii_bindings.dart', '**/lib/widgets/**']
rule:
  kind: identifier
  regex: ^(GestureDetector|RawGestureDetector|Listener|MouseRegion|OverlayPortal|OverlayPortalController|OverlayEntry)$
