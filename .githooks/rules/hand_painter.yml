# AGENTS.md principle 5: a picture drawn stroke by stroke in Dart (CustomPainter) is a drawing of our own to keep.
# Seen failing: 63 matches on app/lib of 2cca45574 (before the cut), 1 on c57338193.
id: hand-painter
language: dart
severity: error
message: a picture drawn by hand in Dart (CustomPainter)
note: a mark is a glyph of the skin's font or an SVG of the skin (flutter_svg); a picture of the document is the engine's
# app/lib/widgets/controls.dart is the one place a painting is put on the screen for the small parts (Badge, IconPress):
# a part that holds a mark takes the painter and paints it there, so the call sites name no CustomPaint.
ignores: ['**/widgets/controls.dart']
rule:
  any:
    - kind: superclass
      regex: CustomPainter
    - kind: identifier
      regex: ^CustomPaint$
