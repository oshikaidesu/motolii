# AGENTS.md principle 5: a picture drawn stroke by stroke in Dart (CustomPainter) is a drawing of our own to keep.
# Seen failing: 63 matches on app/lib of 2cca45574 (before the cut), 1 on c57338193.
id: hand-painter
language: dart
severity: error
message: a picture drawn by hand in Dart (CustomPainter)
note: a mark is a glyph of the skin's font or an SVG of the skin (flutter_svg); a picture of the document is the engine's
# app/lib/widgets/ is the standard: the one place a painting is put on the screen (Glyph, glyph() and Draw, Badge's
# mark). A panel gives a draw function or a glyph's name to those, so its call sites name no CustomPaint.
ignores: ['**/lib/widgets/**']
rule:
  any:
    - kind: superclass
      regex: CustomPainter
    - kind: identifier
      regex: ^CustomPaint$
