# Builds the engine on an Apple silicon Mac as README.md describes, opens a document with what was built, then
# analyzes the app. Runs on pushes to main and pull requests that touch the code, and by hand from the Actions tab.
# A push made while a run is in progress waits for it; only the latest waiting push runs next.
name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['engine/**', 'shelves/**', 'app/**', 'Brewfile', '.github/workflows/build.yml']
  pull_request:
    paths: ['engine/**', 'shelves/**', 'app/**', 'Brewfile', '.github/workflows/build.yml']
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4   # (what the scripts fetch and build, kept between runs while their pins stay)
        id: deps
        with:
          path: |
            engine/third_party/filament_src
            engine/third_party/skia_src
            engine/third_party/thorvg_src
            engine/third_party/physics
            engine/third_party/libtess2
          key: deps-${{ runner.os }}-${{ hashFiles('engine/deps/patches/**', 'engine/deps/filament.sh', 'engine/deps/thorvg.sh', 'engine/deps/skia.sh', 'engine/deps/jolt.sh', 'engine/deps/libtess2.sh') }}
      - uses: actions/cache/restore@v4   # (iris.sh's, apart: its pins change without the others built again; what is built, not OpenCV's source)
        id: iris
        with:
          path: |
            engine/third_party/iris/IRIS
            engine/third_party/iris/spdlog
            engine/third_party/iris/json
            engine/third_party/iris/opencv_out
            engine/third_party/iris/lib
          key: iris-${{ runner.os }}-${{ hashFiles('engine/deps/iris.sh') }}
      - run: brew bundle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
      - run: engine/build.sh
      - run: engine/edit.sh build.motolii < /dev/null   # (a document opened by what was built)
      - run: cd app && flutter analyze lib --no-fatal-infos --no-fatal-warnings
      - uses: actions/cache/save@v4   # (kept even when a step before failed)
        if: always() && steps.deps.outputs.cache-hit != 'true'
        with:
          path: |
            engine/third_party/filament_src
            engine/third_party/skia_src
            engine/third_party/thorvg_src
            engine/third_party/physics
            engine/third_party/libtess2
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - uses: actions/cache/save@v4
        if: always() && steps.iris.outputs.cache-hit != 'true'
        with:
          path: |
            engine/third_party/iris/IRIS
            engine/third_party/iris/spdlog
            engine/third_party/iris/json
            engine/third_party/iris/opencv_out
            engine/third_party/iris/lib
          key: ${{ steps.iris.outputs.cache-primary-key }}
