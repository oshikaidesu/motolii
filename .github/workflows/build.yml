# The whole build on a GitHub Apple silicon Mac, as README.md's "Build and open" does it, then the window's code read by
# flutter analyze (errors stop the run; notices and warnings only tell). There are no self-written tests or checks here; the
# external requirements are in docs/TESTING.md.
# Run on each push to main and each pull request that touch the code, and by hand (Actions › build › Run workflow). A push
# made while one runs waits for it, the latest only (Continuous Delivery ch. 5: what came in meanwhile goes through the
# slow stage together; GitHub's concurrency).
name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['engine/**', 'skin/**', 'Brewfile', '.github/workflows/build.yml']
  pull_request:
    paths: ['engine/**', 'skin/**', 'Brewfile', '.github/workflows/build.yml']
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4   # (what the scripts fetch and build, kept between runs while their pins stay)
        id: deps
        with:
          path: |
            engine/third_party/filament_src
            engine/third_party/skia_src
            engine/third_party/thorvg_src
            engine/third_party/physics
            engine/third_party/libtess2
          key: deps-${{ runner.os }}-${{ hashFiles('engine/dawn_probe/*.patch', 'engine/dawn_probe/build.sh', 'engine/dawn_probe/tvg_on_dawn.sh', 'engine/skia.sh', 'engine/jolt.sh', 'engine/libtess2.sh') }}
      - uses: actions/cache/restore@v4   # (iris.sh's, apart: its pins change without the others built again; what is built, not OpenCV's source)
        id: iris
        with:
          path: |
            engine/third_party/iris/IRIS
            engine/third_party/iris/spdlog
            engine/third_party/iris/json
            engine/third_party/iris/opencv_out
            engine/third_party/iris/lib
          key: iris-${{ runner.os }}-${{ hashFiles('engine/iris.sh') }}
      - run: brew bundle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
      - run: engine/dawn_probe/build.sh
      - run: engine/edit.sh build.motolii < /dev/null
      - run: cd skin/book && flutter analyze lib --no-fatal-infos --no-fatal-warnings
      - uses: actions/cache/save@v4   # (kept even when a step before failed)
        if: always() && steps.deps.outputs.cache-hit != 'true'
        with:
          path: |
            engine/third_party/filament_src
            engine/third_party/skia_src
            engine/third_party/thorvg_src
            engine/third_party/physics
            engine/third_party/libtess2
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - uses: actions/cache/save@v4
        if: always() && steps.iris.outputs.cache-hit != 'true'
        with:
          path: |
            engine/third_party/iris/IRIS
            engine/third_party/iris/spdlog
            engine/third_party/iris/json
            engine/third_party/iris/opencv_out
            engine/third_party/iris/lib
          key: ${{ steps.iris.outputs.cache-primary-key }}
