# Fast checks on every push and pull request: formatting of the Dart and the C++, static analysis and tests of the app,
# and the paths that shelf files and documents name. The full build, with the C++ tests, is build.yml.
name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: dart pub global activate dart_code_linter 4.4.5
      - run: dart pub global run dart_code_linter:metrics analyze lib --fatal-warnings   # avoid-banned-imports: no Material or Cupertino
      - run: flutter test
  engine-format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pipx install clang-format==23.1.5   # the version the tree is formatted with
      - run: git ls-files 'engine/*.h' 'engine/*.cpp' 'engine/*.mm' ':!engine/third_party' | xargs clang-format --dry-run --Werror
  app-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pipx install ast-grep-cli==0.45.3   # the version the rules were written with
      - run: ast-grep scan
        working-directory: app
      - run: "! grep -rn 'ast-grep-ignore' app/lib"   # a bare comment also silences no-suppression, so a rule cannot see it
      # Copy-paste: jscpd at its own defaults (50 tokens, 5 lines). Measured 2026-11-11: 20 clones, 0.35% of lines. Lower the number as clones go.
      - run: npx --yes jscpd@4.3.0 lib --format dart --formats-exts "dart:dart" --ignore "**/motolii_bindings.dart" --threshold 0.5 --reporters console
        working-directory: app
  paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 .githooks/path_check.py --all
