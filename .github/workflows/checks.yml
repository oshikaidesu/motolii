# The repository's own checks, so they hold for everyone and not only for a clone that ran
# `git config core.hooksPath .githooks`: the 500-line rule (.githooks/size_check.py), the layout of AGENTS.md
# 「構成の目標」 (.githooks/layout_check.py), every path a shelf or one of our .md names leading somewhere
# (.githooks/path_check.py), no dropped house word in our identifiers or .md (.githooks/word_check.py, report only
# until its FAIL switch is on), on the tree of the push or pull request; and a subject of 72 characters
# at most (.githooks/subject_check.py) on each commit it brings. The same commands run by hand, from the root of a clone.
# Seconds on a Linux runner: no build and nothing fetched but the history (the build is build.yml). Workflow syntax and events: docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions,
# docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows (the
# `before`/`after` of a push, `pull_request.base.sha`/`head.sha`); values passed through `env`, not pasted into the
# script (docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions).
name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # (the base the tree and the commits are compared with)
      - name: what this push or pull request brings
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base=$PR_BASE; head=$PR_HEAD
          else
            base=$BEFORE; head=$(git rev-parse HEAD)
            # a new branch has no `before` (all zeros): what it brings is what the default branch does not have
            git cat-file -e "$base^{commit}" 2>/dev/null || base=$(git merge-base "origin/$DEFAULT" HEAD)
          fi
          echo "BASE=$base" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$head" >> "$GITHUB_ENV"
      - name: 500 lines a file (.githooks/size_check.py)
        run: python3 .githooks/size_check.py --all "$BASE"
      - name: layout (.githooks/layout_check.py)
        run: python3 .githooks/layout_check.py --all "$BASE"
      - name: paths a shelf or a .md names lead somewhere (.githooks/path_check.py)
        run: python3 .githooks/path_check.py --all
      - name: no dropped house word (.githooks/word_check.py, docs/internal/notes/rename_words.md §5)
        run: python3 .githooks/word_check.py --all
      - name: subjects of 72 characters at most (.githooks/subject_check.py)
        run: python3 .githooks/subject_check.py --range "$BASE..$HEAD_SHA"
